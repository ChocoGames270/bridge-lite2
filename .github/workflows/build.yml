name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buscar y Compilar APK con Gradle
      run: |
        # Busca automáticamente dónde está el archivo gradlew o build.gradle y compila
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
          gradle assembleDebug
        else
          # Si está en una subcarpeta, busca el primer gradlew disponible
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No se encontró gradlew, ejecutando gradle genérico..."
            gradle assembleDebug
          fi
        fi

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: **/build/outputs/apk/debug/*.apk
